services:
  postgres:
    image: postgres:16
    container_name: job_vacancy_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_vacancy_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - job_vacancy_bot_postgres_data:/var/lib/postgresql/data

volumes:
  job_vacancy_bot_postgres_data: